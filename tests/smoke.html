<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dil Atlası — duman testi</title>
<style>
  body{font:15px/1.5 system-ui,sans-serif;margin:16px;background:#07101d;color:#f4f7fb}
  li.ok{color:#7be0c3}li.fail{color:#ff8b9b}#summary{font-weight:700;font-size:1.1rem}
  iframe{width:375px;height:700px;border:1px solid #263954;border-radius:12px;margin-top:12px;background:#fff}
</style>
</head>
<body>
<h1>Dil Atlası — uçtan uca duman testi</h1>
<p>Uygulamayı çerçeve içinde açar ve ana akışları dener. Başta mevcut verini yedekler, sonda aynen geri yükler.</p>
<p id="summary">Çalışıyor…</p>
<ol id="results"></ol>
<iframe id="app" title="Test edilen uygulama"></iframe>
<script>
(async () => {
  const results = document.getElementById('results');
  let pass = 0, fail = 0;
  const check = (ok, msg, extra = '') => { const li = document.createElement('li'); li.className = ok ? 'ok' : 'fail'; li.textContent = `${ok ? '✓' : '✗'} ${msg}${extra ? ' — ' + extra : ''}`; results.append(li); ok ? pass++ : fail++; };
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const today = new Date().toLocaleDateString('en-CA');
  const day = o => { const d = new Date(); d.setDate(d.getDate() + o); return d.toLocaleDateString('en-CA'); };

  // Kullanıcının verisini yedekle.
  const saved = {}; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); saved[k] = localStorage.getItem(k); }
  const frame = document.getElementById('app');
  const FLAG = 'dil-atlasi-sifirlama-2026-09';
  const load = async (keepFlag = true) => { if (keepFlag) localStorage.setItem(FLAG, '1'); frame.src = '../index.html?test=' + Date.now(); await new Promise(r => frame.onload = r); await wait(150); return stub(frame.contentWindow); };
  // Test ortamı: seslendirme anında biter, zamanlayıcılar en fazla 5 ms, onaylar evet, CSP ihlalleri toplanır.
  const stub = w => { w.speechSynthesis.speak = u => w.setTimeout(() => u.onend && u.onend(), 5); w.speechSynthesis.cancel = () => {}; const st = w.setTimeout.bind(w); w.setTimeout = (f, ms) => st(f, Math.min(ms, 5)); w.confirm = () => true; w.cspViolations = []; w.document.addEventListener('securitypolicyviolation', e => w.cspViolations.push(e.violatedDirective + ' ' + e.blockedURI)); return w; };

  try {
    // 0) Tek seferlik sıfırlama: eski kayıtlar silinir ama yedeklenir, diğer ayarlar kalır
    localStorage.clear(); localStorage.setItem(`da:lesson:en:${day(-3)}`, '1'); localStorage.setItem('dil-atlasi-srs', '{"v":2,"cards":{}}'); localStorage.setItem('dil-atlasi-timer', '45');
    await load(false);
    check(localStorage.getItem(`da:lesson:en:${day(-3)}`) === null && localStorage.getItem('dil-atlasi-srs') === null, 'Tek seferlik sıfırlama eski kayıtları sildi');
    check(JSON.parse(localStorage.getItem('dil-atlasi-sifirlama-yedegi') || '{}')[`da:lesson:en:${day(-3)}`] === '1', 'Silinen kayıtlar yedek anahtarında');
    check(localStorage.getItem('dil-atlasi-timer') === '45' && localStorage.getItem(FLAG) === '1', 'Ayarlar korundu, sıfırlama bir kez çalıştı');
    localStorage.setItem(`da:lesson:en:${day(-1)}`, '1'); await load(false);
    check(localStorage.getItem(`da:lesson:en:${day(-1)}`) === '1', 'Sıfırlama ikinci açılışta tekrar çalışmadı');

    // 0b) Şema sürümü ve kontrollü geçiş: eski veri yedeklenir, sürüm 2 olur; daha yeni sürümün verisine dokunulmaz
    localStorage.clear(); localStorage.setItem(`da:lesson:en:${day(-2)}`, '1'); localStorage.setItem('dil-atlasi-srs', JSON.stringify({v:2, cards:{}, stats:{en:{ok:'3', n:'4'}}}));
    await load();
    const mig = JSON.parse(localStorage.getItem('dil-atlasi-goc-yedegi') || '{}'), mst = JSON.parse(localStorage.getItem('dil-atlasi-srs')).stats.en;
    check(localStorage.getItem('dil-atlasi-surum') === '2' && mig.from === 1 && mig.data?.[`da:lesson:en:${day(-2)}`] === '1', 'Geçiş: sürüm 2, eski kayıtlar geçiş yedeğinde');
    check(mst.ok === 3 && mst.n === 4 && localStorage.getItem(`da:lesson:en:${day(-2)}`) === '1' && JSON.parse(localStorage.getItem('dil-atlasi-plan')).v === 1, 'Geçiş: veri korundu, yeni anahtarlar başlatıldı');
    localStorage.clear(); localStorage.setItem('dil-atlasi-surum', '99'); await load();
    check(localStorage.getItem('dil-atlasi-surum') === '99' && localStorage.getItem('dil-atlasi-plan') === null, 'Daha yeni sürümün verisine dokunulmadı');

    // 1) Temiz kurulum
    localStorage.clear();
    let w = await load(), $ = s => w.document.querySelector(s), $$ = s => [...w.document.querySelectorAll(s)];
    check($('#lessonPill').textContent === 'Ders 1/30', 'Temiz kurulumda Ders 1/30', $('#lessonPill').textContent);
    check($('#lessonTitle').textContent === 'Selamlaşma', 'İlk ders başlığı Selamlaşma');
    check($$('.step.open .item:not(.freq) .pron').length === 8, 'Sekiz kelimenin Türkçe okunuşu görünüyor', $$('.step.open .item .pron').map(e => e.textContent).slice(0, 3).join(' '));
    check(!!$('#voiceSelect') && $('#voiceSelect').options.length >= 1, 'Ses seçici var');
    check($$('.step').length === 4, '4 aşama görünüyor');
    check($$('.lang-chip').length === 4, '4 dil düğmesi var');
    check(!w.document.getElementById('panel-bugun').hidden && w.document.getElementById('panel-yuru').hidden, 'Varsayılan sekme Bugün');

    // 2) Dil geçişi ve kalıcılık
    $$('.lang-chip')[1].click();
    check(localStorage.getItem('dil-atlasi-active') === 'fr', 'Fransızca seçimi kaydedildi');
    check($('.step.open .item strong')?.textContent === w.LESSONS.fr[0].w[0][0], 'Fransızca ilk kelime görünüyor', $('.step.open .item strong')?.textContent);
    $('#tab-izle').click();
    w = await load(); $ = s => w.document.querySelector(s); $$ = s => [...w.document.querySelectorAll(s)];
    check($('#todayEyebrow').textContent.startsWith('Fransızca'), 'Yenilemede dil korunuyor');
    check(!$('#panel-izle').hidden, 'Yenilemede sekme korunuyor');
    check($$('#videoRes a').length >= 2 && $$('#videoRes a').every(a => a.rel === 'noopener noreferrer'), 'İzle: video bağlantıları noopener');
    $('#tab-bugun').click();

    // 3) Kelimeler + cümle kurma + aşama işaretleme
    const idx = 0, target = w.LESSONS.fr[idx].p[0][0].split(/\s+/);
    for (const tok of target) { const c = $$('.step.open .build-pool .chip').find(x => x.textContent === tok); c && c.click(); }
    check($('.step.open .result').textContent.startsWith('Doğru'), 'Cümle kurma: doğru sıra kabul edildi');
    // 3a) Cümle kurma sonu: başa sarmaz, doğru/yanlış özetini gösterir; Baştan ilk cümleye döner
    const bx = () => $('.step.open .build-pool').parentElement, bbtn = t => [...bx().querySelectorAll('.step-actions .btn')].find(b => b.textContent.startsWith(t));
    const solve = k => { for (const tok of w.LESSONS.fr[idx].p[k][0].split(/\s+/)) { const c = [...bx().querySelectorAll('.build-pool .chip')].find(x => x.textContent === tok); c && c.click(); } };
    bbtn('Sıradaki').click(); check(bx().querySelector('p').textContent.startsWith('2/5'), 'Cümle kurma: ikinci cümle');
    bbtn('Baştan').click(); check(bx().querySelector('p').textContent.startsWith('1/5'), 'Cümle kurma: Baştan ilk cümleye döndü');
    solve(0); bbtn('Sıradaki').click();
    [...bx().querySelectorAll('.build-pool .chip')].forEach(() => bx().querySelector('.build-pool .chip').click());
    check(bx().querySelector('.result').classList.contains('no'), 'Cümle kurma: yanlış sıra reddedildi');
    bbtn('Sıradaki').click(); bbtn('Sıradaki').click(); bbtn('Sıradaki').click(); solve(4);
    check(!bbtn('Sıradaki') && !!bbtn('Bitir'), 'Son cümlede Sıradaki yerine Bitir');
    bbtn('Bitir').click();
    const sum = $('.step.open .build-target') ? '' : ($$('.step.open .result').find(r => /cümleden/.test(r.textContent))?.textContent || '');
    check(/5 cümleden 2 doğru, 1 yanlış, 2 atlandı/.test(sum), 'Cümle kurma bitince özet gösterildi, başa sarmadı', sum);
    [...w.document.querySelectorAll('.step.open .btn')].find(b => b.textContent === 'Baştan başla').click();
    check(bx().querySelector('p').textContent.startsWith('1/5'), 'Özetten sonra Baştan başla ilk cümleye döndü');
    $$('.step.open .btn').find(b => b.textContent.startsWith('Tamamladım')).click();
    check(localStorage.getItem(`da:lesson:fr:${today}`) === '1', 'Kelimeler aşaması da:lesson anahtarına yazıldı');
    check($('.step.open .step-title').textContent === 'Dinle ve tekrar et', 'Sonraki aşama açıldı');
    check($('#todayBar').style.width === '50%', 'İlerleme çubuğu %50', $('#todayBar').style.width);

    // 3b) En sık 1000 kelime: ders tamamlanınca ilk paket öğrenildi, bugün aynı paket görünmeye devam eder
    const fst = JSON.parse(localStorage.getItem('dil-atlasi-sik') || '{}').fr;
    check(fst && fst.done === 1 && fst.last === today, 'Sık kelimeler: ders tamamlanınca 1. paket sayıldı', JSON.stringify(fst));
    const hf = $$('.step-head'); if (hf[1].getAttribute('aria-expanded') !== 'true') hf[1].click();
    check($$('.step.open .item.freq').length === 10 && $$('.step.open .item.freq strong')[0].textContent.includes(w.FREQ.fr[0][0]), 'Sık kelimeler: bugünün 10 kelimesi (1–10) görünüyor');
    check($$('.step.open .item.freq .example').length === 10, 'Sık kelimeler: örnek cümleler var');
    $$('.step.open .btn').find(b => b.textContent === 'Geri al').click();
    check(JSON.parse(localStorage.getItem('dil-atlasi-sik')).fr.done === 0, 'Geri alınca paket sayacı geri döndü');
    const hf2 = $$('.step-head'); if (hf2[1].getAttribute('aria-expanded') !== 'true') hf2[1].click();
    $$('.step.open .btn').find(b => b.textContent.startsWith('Tamamladım')).click();

    // 3c) Ses zinciri: "Hepsini dinle" başka bir ▶ ile durur (Safari cancel sonrası onend gönderse bile)
    const spoken = [], fakeSpeak = u => { spoken.push(u.lang); w.setTimeout(() => u.onend && u.onend(), 5); };
    w.speechSynthesis.speak = fakeSpeak; w.speechSynthesis.cancel = () => {};
    const hl = $$('.step-head'); if (hl[1].getAttribute('aria-expanded') !== 'true') hl[1].click();
    $$('.step.open .btn').find(b => b.textContent === '▶ Hepsini dinle').click(); await wait(2);
    $$('.step.open .item .speak')[3].click(); await wait(150);
    check(spoken.length === 2, 'Tek ▶, "Hepsini dinle" zincirini durdurdu', `çalınan=${spoken.length}`);
    spoken.length = 0; $$('.step.open .btn').find(b => b.textContent === '▶ Hepsini dinle').click(); await wait(150);
    check(spoken.length === 8, '"Hepsini dinle" yalnızca basınca 8 kelimeyi okudu', `çalınan=${spoken.length}`);

    // 4) Dinle: ses çalışması baştan sona, Türkçe seslendirilmez, anlam yazılı; bitince shadow işaretlenir
    spoken.length = 0; $('#tab-yuru').click(); $('#drillPlay').click(); for (let i = 0; i < 40 && !$('#drillTr').textContent; i++) await wait(5);
    check($('#drillL2').textContent === w.LESSONS.fr[0].w[0][0] && $('#drillTr').textContent.endsWith(w.LESSONS.fr[0].w[0][1]), 'Ses çalışması: hedef dil büyük, Türkçe anlam altında yazılı', $('#drillTr').textContent);
    for (let i = 0; i < 400 && !$('#drillL1').textContent.startsWith('Bitti'); i++) await wait(50);
    check($('#drillL1').textContent.startsWith('Bitti'), 'Ses çalışması tamamlandı');
    check(spoken.length > 0 && spoken.every(l => l.startsWith('fr')), 'Ses çalışmasında Türkçe seslendirme yok', [...new Set(spoken)].join(','));
    check(!$('#trVoiceSelect'), 'Türkçe ses seçici kaldırıldı');
    $('#drillPlay').click(); await wait(2); $('#tab-bugun').click(); await wait(20);
    check($('#drillPlay').textContent === '▶ Başlat', 'Sekme değişince ses çalışması durdu'); $('#tab-yuru').click();
    w.document.querySelector('input[name=rate][value="0.8"]').click();
    check(localStorage.getItem('dil-atlasi-rate') === '0.8', 'Konuşma hızı kaydedildi');
    check(localStorage.getItem(`da:shadow:fr:${today}`) === '1', 'Ses çalışması bitince shadow işaretlendi');
    check($$('#audioRes a').length >= 2, 'Dinle: podcast bağlantıları var');

    // 5) Konuş: ChatGPT bağlantısı yalnızca ders metnini taşır
    $('#tab-bugun').click();
    const heads = $$('.step-head'); if (heads[3].getAttribute('aria-expanded') !== 'true') heads[3].click();
    const gpt = $$('.step.open a').find(a => a.textContent.includes('ChatGPT'));
    const q = decodeURIComponent(gpt.href.split('?q=')[1] || '');
    check(gpt.href.startsWith('https://chatgpt.com/?q=') && gpt.rel === 'noopener noreferrer', 'ChatGPT bağlantısı doğru ve noopener');
    check(q.includes(w.LESSONS.fr[0].t) && !q.includes('localStorage'), 'Mesaj günün dersini içeriyor');

    check(/EN FAZLA 2/.test(q) && /senaryo/.test(q), 'Mesaj senaryo ve en fazla 2 düzeltme kuralı içeriyor');

    // 5b) Hata defteri: kullanıcı girdisi metin olarak saklanır, günde en fazla 2
    const xss = '<img src=x onerror=alert(1)>Je suis là.';
    const [inT, inTr] = $$('.step.open .note-form input'); inT.value = xss; inTr.value = 'Buradayım.';
    $$('.step.open .note-form .btn')[0].click();
    const notes = JSON.parse(localStorage.getItem('dil-atlasi-notlar'));
    const noteVals = Object.values(notes.items);
    check(noteVals.length === 1 && noteVals[0].t === xss && noteVals[0].d === today, 'Hata defterine not eklendi (metin olarak)');
    const [inT2] = $$('.step.open .note-form input'); inT2.value = 'Deuxième phrase.'; $$('.step.open .note-form .btn')[0].click();
    check($$('.step.open .note-form .btn')[0].disabled, 'Günde 2 nottan sonra ekleme kapandı');
    check(!w.document.querySelector('img[src="x"]'), 'Not içeriği HTML olarak çalışmadı');

    // 5a) Telaffuz testi Konuş adımında görünür: her kelime/cümle için ▶, 🎙 Kaydet, ✓ Kontrol et
    let stopped = 0, deny = true;
    w.navigator.mediaDevices.getUserMedia = async () => { if (deny) throw Object.assign(new Error('x'), {name:'NotAllowedError'}); return {getTracks: () => [{stop() { stopped++; }}]}; };
    w.MediaRecorder = class { constructor() { this.state = 'inactive'; this.mimeType = 'audio/webm'; } start() { this.state = 'recording'; } stop() { this.state = 'inactive'; this.ondataavailable({data:new w.Blob(['x'], {type:'audio/webm'})}); this.onstop(); } };
    // iPhone Safari modeli (gerçek cihaz tanılamasından, v18: "başladı → mikrofon" ve sonra hiçbir şey):
    // - Sayfada yalnızca ilk start() ses alır; sonraki her oturumda mikrofon açılır ama ses gelmez (sonuç/hata/end yok).
    // - start() dokunma (click) dışında çağrılırsa da ses gelmez.
    // - Sürekli (continuous) oturum açık kalır; söylenenler tek bir büyüyen ara sonuçta birikir (isFinal yok).
    // - stop() 'end' gönderir; abort() göndermez. Açık nesnede start() InvalidStateError fırlatır.
    let micOpen = 0, pageStarts = 0, deadStarts = 0, instances = 0, liveRec = null;
    w.SpeechRecognition = w.webkitSpeechRecognition = class {
      constructor() { this.n = ++instances; }
      start() {
        if (this.open) throw new w.DOMException('already started', 'InvalidStateError');
        pageStarts++; const inTap = w.event?.type === 'click';
        this.alive = inTap && pageStarts === 1; if (!this.alive) deadStarts++;
        micOpen++; this.open = true; this.list = []; liveRec = this;
        this.onstart?.(); this.onaudiostart?.();
      }
      stop() { w.setTimeout(() => { if (!this.open) return; this.open = false; micOpen--; if (liveRec === this) liveRec = null; this.onend?.(); }, 5); }
      abort() { if (this.open) { this.open = false; micOpen--; if (liveRec === this) liveRec = null; } }
    };
    // Kullanıcı konuşur: açık ve ses alan oturuma eklenir.
    // iPhone yeni konuşmayı üç biçimde bildirebiliyor: 'ekle' (aynı metne ekler), 'yeni' (duraklamadan sonra metni yalnızca yeni cümleyle
    // baştan yazar), 'sira' (yeni bir sonuç sırası açar). Varsayılan 'ekle'.
    let sayMode = 'ekle';
    const say = t => {
      const r = liveRec; if (!r || !r.alive) return;
      r.list ||= [];
      if (sayMode === 'sira' || !r.list.length) r.list.push(t);
      else r.list[r.list.length - 1] = sayMode === 'yeni' ? t : (r.list[r.list.length - 1] + ' ' + t).trim();
      r.onresult({resultIndex:0, results:r.list.map(x => Object.assign([{transcript:x}], {isFinal:false}))});
    };
    const hk = $$('.step-head'); hk[3].click(); if ($$('.step-head')[3].getAttribute('aria-expanded') !== 'true') $$('.step-head')[3].click();
    const rows = $$('.step.open .pron-item');
    check(rows.length === 13 && rows[0].querySelector('strong').textContent === w.LESSONS.fr[0].w[0][0] && rows[0].textContent.includes(w.LESSONS.fr[0].w[0][1]), 'Telaffuz testi: 8 kelime + 5 cümle, Türkçe anlam yazılı', `satır=${rows.length}`);
    const say0 = rows[8], tools = say0.querySelector('.pron-tools'), recBtn = [...tools.querySelectorAll('.btn')].find(b => b.textContent.includes('Kaydet'));
    recBtn.click(); await wait(20);
    check(/izni verilmedi/.test(tools.querySelector('.rec [role=status]').textContent), 'Mikrofon izni reddedilince açıklama gösterildi');
    // Test ortamında zamanlayıcılar 5 ms'ye kısaltıldığı için kayıt süre sınırında kendiliğinden biter.
    deny = false; recBtn.click(); await wait(40);
    const aud = tools.querySelector('.rec audio');
    check(stopped === 1 && aud && aud.src.startsWith('blob:') && recBtn.textContent.includes('Yeniden'), 'Kayıt süre sınırında bitti: mikrofon kapatıldı, kayıt dinlenebilir');
    recBtn.click(); await wait(40);
    check(stopped === 2 && tools.querySelectorAll('.rec audio').length === 1 && tools.querySelector('.rec audio').src !== aud.src, 'Yeni kayıt eskisinin yerini aldı');
    // Otomatik kontrol: önce açık onay, sonra kelime kelime sonuç
    const target8 = w.LESSONS.fr[0].p[0][0], chk = [...tools.querySelectorAll('.btn')].find(b => b.textContent.includes('Kontrol'));
    const res8 = () => tools.querySelector('.check').textContent;
    chk.click(); await wait(20);
    check(/Onaylıyor musun/.test(res8()) && localStorage.getItem('dil-atlasi-tanima') === null, 'Otomatik kontrol önce onay istiyor');
    [...tools.querySelectorAll('.check .btn')].find(b => b.textContent.startsWith('Onayla')).click(); say(target8.toLowerCase().replace(/[.,!?]/g, '')); await wait(40);
    check(localStorage.getItem('dil-atlasi-tanima') === '1' && /%100/.test(res8()), 'Doğru söylenince %100', res8());
    check(micOpen === 1 && !$('#asrBar').hidden && /Mikrofon açık/.test($('#asrBar').textContent), 'Oturum açık kalıyor ve "Mikrofon açık · Kapat" çubuğu görünüyor');
    const words8 = target8.split(/\s+/).filter(x => /\p{L}/u.test(x));
    chk.click(); say(words8.slice(0, -1).join(' ') + ' xyz'); await wait(40);
    check(tools.querySelectorAll('.check .word-miss').length === 1 && tools.querySelectorAll('.check .word-ok').length === words8.length - 1, 'İkinci kontrol: eksik kelime kırmızı (aynı oturum, önceki söz karışmadı)', res8());
    chk.click(); say(target8); await wait(40);
    check(/%100/.test(res8()), 'Üçüncü kontrol de sonuç verdi', res8());
    chk.click(); await wait(2); chk.click(); await wait(20);
    check(chk.textContent === '✓ Kontrol et' && /Ses duyulmadı/.test(res8()) && micOpen === 1, 'Söylemeden Bitir: "Ses duyulmadı", oturum açık kalır', res8());
    check(![...tools.querySelectorAll('.btn')].some(b => b.textContent === '▶ Doğrusu'), '"▶ Doğrusu" düğmesi kaldırıldı');
    // Kullanıcının senaryosu: yanlış, sonra doğru, art arda 5 kez
    const seq = [];
    for (let k = 0; k < 5; k++) { chk.click(); say(k % 2 ? target8 : 'how are you'); await wait(40); seq.push(tools.querySelector('.check .result')?.textContent.match(/%\d+/)?.[0] || res8()); }
    check(seq.join(' ') === '%0 %100 %0 %100 %0', 'Art arda 5 kontrol: yanlış/doğru her seferinde doğru sonuç', seq.join(' '));
    const tools0 = rows[0].querySelector('.pron-tools'), chk0 = [...tools0.querySelectorAll('.btn')].find(b => b.textContent.includes('Kontrol'));
    chk0.click(); say(w.LESSONS.fr[0].w[0][0]); await wait(40);
    check(/%100/.test(tools0.querySelector('.check').textContent), 'Başka satırda kontrol aynı oturumla sonuç verdi', tools0.querySelector('.check').textContent);
    // Kullanıcının bildirdiği sıra: "how are you" → "hello" → "hello" → "thank you"; üç bildirim biçiminde de her biri doğru değerlendirilmeli
    const rowOf = word => rows.find(r => r.querySelector('strong').textContent.toLowerCase() === word);
    for (const mode of ['ekle', 'yeni', 'sira']) {
      sayMode = mode; const got = [];
      for (const [word, spoken] of [['salut', 'ça va'], ['salut', 'salut'], ['salut', 'salut'], ['merci', 'merci']]) {
        const row = rowOf(word) || rows[0], c = [...row.querySelectorAll('.pron-tools .btn')].find(b => b.textContent.includes('Kontrol'));
        c.click(); say(spoken); await wait(40); got.push(row.querySelector('.check .result')?.textContent.match(/%\d+/)?.[0] || row.querySelector('.check').textContent.slice(0, 40));
      }
      check(got.join(' ') === '%0 %100 %100 %100', `Kullanıcının sırası (${mode}): yanlış, doğru, doğru, başka kelime doğru`, got.join(' '));
    }
    sayMode = 'ekle';
    check(deadStarts === 0 && pageStarts === 1 && instances === 1, 'Bütün kontroller tek oturumla yapıldı (iPhone yalnızca ilkini dinliyor)', `başlatma=${pageStarts} ölü=${deadStarts} nesne=${instances}`);
    // Kapat: mikrofon kapanır, çubuk gizlenir
    $('#asrBar .btn').click(); await wait(20);
    check(micOpen === 0 && $('#asrBar').hidden, 'Kapat ile mikrofon kapandı');
    // Yeniden açılan oturum iPhone'da sessiz kalır → "Yenile ve devam et" önerilir; yenileyince Konuş adımı açılır ve çalışır

    const rb = [...tools0.querySelectorAll('.check .btn')].find(b => b.textContent.includes('Yenile'));
    check(!!rb && /Tanılama v\d+: başladı → mikrofon/.test(tools0.querySelector('.check').textContent), 'Sessiz yeniden açılışta Yenile önerisi ve tanılama satırı', tools0.querySelector('.check').textContent);
    w.__eskiSayfa = true; const reloaded = new Promise(r => frame.onload = r); rb.click(); await reloaded; await wait(150);
    w = stub(frame.contentWindow); check(!w.__eskiSayfa, 'Yenile ve devam et sayfayı yeniledi');
    $ = s => w.document.querySelector(s); $$ = s => [...w.document.querySelectorAll(s)];

    const back = $('.pron-item.ready');

    // Kullanıcının v22 durumu: sayfanın İLK oturumu da sessiz (ör. önce seslendirme çalındı) → yine Yenile önerilir, tanılamada tts sayısı görünür
    let micOpen2 = 0;

    check(!Object.keys(localStorage).some(k => /kayit|rec|audio/i.test(k)), 'Ses kaydı saklanmadı');

    // 5c) Aynı gün kendini sına

    // 5d) Ertesi gün hata defteri kartı tekrar kuyruğunda (text olarak)
    const nn = JSON.parse(localStorage.getItem('dil-atlasi-notlar')); Object.values(nn.items).forEach(x => x.d = day(-1)); localStorage.setItem('dil-atlasi-notlar', JSON.stringify(nn));
    localStorage.setItem(`da:lesson:fr:${day(-1)}`, '1');
    w = await load(); $ = s => w.document.querySelector(s); $$ = s => [...w.document.querySelectorAll(s)];
    const cardsFr = w.dueCards('fr').filter(c => c.id.includes(':n:'));
    check(cardsFr.length === 2 && cardsFr.some(c => c.target === xss), 'Hata defteri kartları ertesi gün tekrarda');
    check(!w.document.querySelector('img[src="x"]'), 'Kart gösteriminde HTML çalışmadı');

    // 6) Ertesi gün: ders ilerler, tekrar kartları gelir
    localStorage.clear(); localStorage.setItem('dil-atlasi-active', 'en'); localStorage.setItem(`da:lesson:en:${day(-1)}`, '1');
    w = await load(); $ = s => w.document.querySelector(s); $$ = s => [...w.document.querySelectorAll(s)];
    check($('#lessonPill').textContent === 'Ders 2/30', 'Bir gün çalışınca Ders 2', $('#lessonPill').textContent);
    check(/Kalan 13 kart/.test($('.step.open .flash')?.textContent || ''), 'Dünkü 13 öğe tekrar kartı oldu');
    let n = 0; while ($('#steps .flash') && n < 20) { $('#steps .flash .btn').click(); const b = $$('#steps .flash .actions .btn'); (n === 0 ? b[0] : b[1]).click(); n++; }
    const srs = JSON.parse(localStorage.getItem('dil-atlasi-srs'));
    check(n === 13 && srs.v === 2, '13 kart değerlendirildi, v2 biçimi', `n=${n}`);
    const lg = JSON.parse(localStorage.getItem('dil-atlasi-gunluk')).d[today]?.en;
    check(lg?.c === 13 && lg.ok === 12, 'Günlük istatistik: 13 kart, 12 bilinen', JSON.stringify(lg));
    const cur = $('#statsBody tr.current');
    check(cur && cur.querySelectorAll('td')[2].textContent === '13' && cur.querySelectorAll('td')[3].textContent === '%92', 'İlerleme: haftalık tabloda bugünkü kartlar', cur?.textContent);
    check(/13 kart/.test($('#statsToday').textContent), 'İlerleme: bugünün özeti', $('#statsToday').textContent);
    check(srs.cards['en:0:w0'].d === day(1) && srs.cards['en:0:w1'].d === day(1), 'Bilinen ve bilinmeyen kart ertesi güne planlandı');
    check(localStorage.getItem(`da:review:en:${today}`) === '1', 'Kartlar bitince review kendiliğinden işaretlendi');
    const h3 = $$('.step-head'); if (h3[1].getAttribute('aria-expanded') !== 'true') h3[1].click();
    check($$('.step.open .item strong').some(e => e.textContent.startsWith('🇹🇷')), 'Somut kelimede emoji ipucu görünüyor (Ders 2: Türkiye)');

    // 6-plan) Haftalık plan: bugünü seç, hedef 2 aşama; dil düğmesi ve Bugün ipucu güncellenir
    const dow = String(new Date().getDay());
    $(`#planDays input[value="${dow}"]`).click(); $('#planGoal input[value="2"]').click();
    const pl = JSON.parse(localStorage.getItem('dil-atlasi-plan')).langs.en;
    check(pl.days.length === 1 && pl.days[0] === +dow && pl.goal === 2, 'Plan kaydedildi', JSON.stringify(pl));
    check($$('.lang-chip')[0].classList.contains('planned') && /bugün planda/.test($$('.lang-chip')[0].getAttribute('aria-label')), 'Dil düğmesinde bugün planda işareti');
    check(/bugün İngilizce günü/.test($('#planHint').textContent) && /0\/1/.test($('#planHint').textContent), 'Bugün ipucu planı ve hedefi gösteriyor', $('#planHint').textContent);
    $$('.lang-chip')[1].click();
    check(/planında yok; planlı: İngilizce/.test($('#planHint').textContent), 'Planda olmayan dil için yumuşak hatırlatma', $('#planHint').textContent);
    $(`#planDays input[value="${dow}"]`).click(); $$('.lang-chip')[2].click(); $(`#planDays input[value="${dow}"]`).click();
    check($('#planWarn').textContent.includes('Fransızca ve İtalyanca aynı günlerde'), 'Fransızca-İtalyanca aynı gün uyarısı');
    $$('.lang-chip')[0].click();

    // 6a) Dünkü sık kelime paketi bugün tekrar kartı olur
    localStorage.setItem('dil-atlasi-sik', JSON.stringify({en: {on: true, done: 1, last: day(-1)}}));
    w = await load(); $ = s => w.document.querySelector(s); $$ = s => [...w.document.querySelectorAll(s)];
    check(w.dueCards('en').filter(c => c.id.startsWith('en:f:')).length === 10, 'Dünkü 10 sık kelime tekrar kuyruğunda');
    const hs = $$('.step-head'); if (hs[1].getAttribute('aria-expanded') !== 'true') hs[1].click();
    check($$('.step.open .item.freq strong')[0]?.textContent.includes(w.FREQ.en[10][0]), 'Bugün 11–20. kelimeler gösteriliyor');
    $('#tab-ilerleme').click(); $('#freqToggle').click();
    check(JSON.parse(localStorage.getItem('dil-atlasi-sik')).en.on === false && !w.document.querySelector('.item.freq'), 'Sık kelimeler kapatılabiliyor');
    $('#freqToggle').click(); $('#tab-bugun').click();

    // 6b) Uzun süreli hatırlama ölçüsü: 7+ gün aralıklı kart
    const st6 = JSON.parse(localStorage.getItem('dil-atlasi-srs')); st6.cards['en:0:s0'] = {b:2, d:today}; localStorage.setItem('dil-atlasi-srs', JSON.stringify(st6));
    w = await load(); $ = s => w.document.querySelector(s); $$ = s => [...w.document.querySelectorAll(s)];
    const h6 = $$('.step-head'); if (h6[0].getAttribute('aria-expanded') !== 'true') h6[0].click();
    $('#steps .flash .btn').click(); $$('#steps .flash .actions .btn')[1].click();
    const st7 = JSON.parse(localStorage.getItem('dil-atlasi-srs'));
    check(st7.stats?.en?.n === 1 && st7.stats.en.ok === 1 && st7.cards['en:0:s0'].b === 3, 'Uzun aralıklı kart hatırlama ölçüsüne sayıldı');
    check(/%100/.test($('#retention').textContent), 'İlerleme: 7+ gün hatırlama oranı gösteriliyor', $('#retention').textContent);

    // 7) Yedekleme: dışa aktar, bozuk dosyayı reddet, geri yükle
    let blob; const oc = w.URL.createObjectURL; w.URL.createObjectURL = b => { blob = b; return oc(b); }; w.HTMLAnchorElement.prototype.click = function () {};
    $('#exportData').click(); const backup = JSON.parse(await blob.text());
    check(backup.schemaVersion === 2 && backup.srsVersion === 2 && Object.keys(backup.srs).length === 13, 'Yedek görevleri ve 13 kartı içeriyor');
    check(backup.srsStats?.en?.n === 1 && backup.plan?.en?.goal === 2 && backup.log?.[today]?.en?.c >= 13, 'Yedek hatırlama ölçüsü, plan ve günlük istatistiği içeriyor');
    check(backup.notes && typeof backup.notes === 'object', 'Yedek hata defterini içeriyor');
    const imp = async data => { const dt = new w.DataTransfer(); dt.items.add(new w.File([typeof data === 'string' ? data : JSON.stringify(data)], 'b.json')); $('#importFile').files = dt.files; $('#importFile').dispatchEvent(new w.Event('change')); await wait(100); return $('#dataStatus'); };
    check((await imp('{bozuk')).classList.contains('error'), 'Bozuk JSON reddedildi');
    backup.srs['<img>'] = {b:1, d:today}; backup.srs['en:0:w9'] = {b:99, d:'x'};
    localStorage.clear();
    await imp(backup);
    const restored = JSON.parse(localStorage.getItem('dil-atlasi-srs'));
    check(Object.keys(restored.cards).length === 13 && localStorage.getItem(`da:lesson:en:${day(-1)}`) === '1', 'Geri yükleme kartları ve görevleri getirdi, geçersizleri almadı');
    check(restored.stats?.en?.n === 1 && JSON.parse(localStorage.getItem('dil-atlasi-plan')).langs.en.goal === 2 && JSON.parse(localStorage.getItem('dil-atlasi-gunluk')).d[today].en.c >= 13, 'Geri yükleme ölçüyü, planı ve istatistiği getirdi');
    const v1 = {app:'dil-atlasi', schemaVersion:1, tasks:{[`da:speak:it:${day(-4)}`]:'1'}};
    check(!(await imp(v1)).classList.contains('error') && localStorage.getItem(`da:speak:it:${day(-4)}`) === '1', 'Eski (sürüm 1) yedek hâlâ yüklenebiliyor');

    // 8) Sayaç
    w = await load(); $ = s => w.document.querySelector(s); $$ = s => [...w.document.querySelectorAll(s)];
    $('#tab-ilerleme').click(); $('#timerDuration input[value="45"]').click();
    check($('#timerDisplay').textContent === '45:00' && localStorage.getItem('dil-atlasi-timer') === '45', 'Sayaç 45 dk seçildi');
    $('#timerToggle').click(); check($('#timerToggle').textContent === 'Duraklat', 'Sayaç başladı');
    const realNow = w.Date.now; w.Date.now = () => realNow.call(w.Date) + 60_000; await wait(700);
    check($('#timerDisplay').textContent === '44:00', 'Sayaç bitiş anından hesaplanıyor (arka planda kaymaz)', $('#timerDisplay').textContent);
    w.Date.now = realNow;
    $('#timerToggle').click(); check($('#timerToggle').textContent === 'Devam et', 'Sayaç durdu');
    $('#timerReset').click(); check($('#timerDisplay').textContent === '45:00', 'Sayaç sıfırlandı');
    check($$('#lessonList li').length === 30 && $('#lessonList li.current').textContent === w.LESSONS.en[1].t, '30 günlük rota, güncel ders işaretli');

    // 9) Dili sıfırla: yalnızca o dil silinir
    localStorage.setItem(`da:lesson:de:${day(-1)}`, '1');
    $('#resetLang').click();
    check(localStorage.getItem(`da:lesson:en:${day(-1)}`) === null && localStorage.getItem(`da:lesson:de:${day(-1)}`) === '1', 'Sıfırlama yalnızca seçili dili sildi');
    check(!Object.keys(JSON.parse(localStorage.getItem('dil-atlasi-srs')).cards).some(k => k.startsWith('en:')), 'Sıfırlama o dilin kartlarını sildi');
    check($('#lessonPill').textContent === 'Ders 1/30', 'Sıfırlamadan sonra Ders 1');

    // 9b) Kadın/erkek ses: üstteki ♀ ♂ düğmeleri; doğal aksan (dilin kendi bölgesi) öne alınır
    const V = (name, lang) => ({name, lang, voiceURI: name, default: false});
    let voices = [V('Thomas', 'fr-FR'), V('Amélie', 'fr-CA'), V('Audrey (Enhanced)', 'fr-FR'), V('Google français', 'fr-FR'), V('Samantha', 'en-US'), V('Daniel', 'en-GB'), V('Alice', 'it-IT')];
    w.speechSynthesis.getVoices = () => voices;
    const toastText = () => $('#toast').textContent, pressed = g => $(`#genderToggle button[data-g="${g}"]`).getAttribute('aria-pressed');
    check(w.voiceFor('fr-FR').name === 'Audrey (Enhanced)', 'Otomatik: en doğal Fransa sesi', w.voiceFor('fr-FR').name);
    $('#genderToggle button[data-g="m"]').click();
    check(localStorage.getItem('dil-atlasi-ses-cinsiyet') === 'm' && pressed('m') === 'true' && w.voiceFor('fr-FR').name === 'Thomas' && w.voiceFor('en-US').name === 'Daniel', '♂: Fransızca Thomas, İngilizce Daniel', `${w.voiceFor('fr-FR').name}, ${w.voiceFor('en-US').name}`);
    check(/Erkek ses: Daniel/.test(toastText()), 'Seçilen ses bildirimi gösterildi', toastText());
    $('#genderToggle button[data-g="f"]').click();
    check(pressed('f') === 'true' && pressed('m') === 'false' && w.voiceFor('fr-FR').name === 'Audrey (Enhanced)' && w.voiceFor('en-US').name === 'Samantha', '♀: Fransızca Audrey, İngilizce Samantha');
    voices = voices.filter(v => !/Audrey|Google/.test(v.name));
    check(w.voiceFor('fr-FR').name === 'Amélie', '♀: Fransa kadın sesi yoksa Kanada kadın sesi', w.voiceFor('fr-FR').name);
    $('#genderToggle button[data-g="f"]').click();
    check(!localStorage.getItem('dil-atlasi-ses-cinsiyet') && w.voiceFor('fr-FR').name === 'Thomas', 'Seçili düğmeye yeniden dokununca otomatik (aksan önce: Thomas fr-FR)', w.voiceFor('fr-FR').name);
    localStorage.setItem('dil-atlasi-voices', JSON.stringify({fr: 'Thomas'})); $('#genderToggle button[data-g="f"]').click();
    check(w.voiceFor('fr-FR').name === 'Amélie', 'Elle seçilen erkek ses, kadın tercihiyle çakışınca kadın ses kullanılır');
    voices = [V('Alice', 'it-IT')]; $$('.lang-chip')[2].click(); $('#genderToggle button[data-g="m"]').click();
    check(/İtalyanca erkek ses yok/.test(toastText()) && w.voiceFor('it-IT').name === 'Alice', 'Erkek ses yoksa söylenir ve olan ses kullanılır', toastText());
    $('#genderToggle button[data-g="m"]').click(); $$('.lang-chip')[0].click(); localStorage.removeItem('dil-atlasi-voices');

    // 10) Mobil ve güvenlik
    check(w.document.documentElement.scrollWidth <= w.innerWidth, 'Mobil genişlikte yatay taşma yok');
    check(w.cspViolations.length === 0, 'CSP ihlali yok', w.cspViolations.join(', '));
    check(!!w.document.querySelector('meta[http-equiv="Content-Security-Policy"]'), 'CSP etiketi var');
    check(/^Sürüm v\d+$/.test(w.document.getElementById('appVersion').textContent), 'Sürüm İlerleme sekmesinde görünüyor', w.document.getElementById('appVersion').textContent);
  } catch (e) {
    check(false, 'Test beklenmedik şekilde durdu', e.message);
  } finally {
    // Kullanıcının verisini geri yükle.
    localStorage.clear(); Object.entries(saved).forEach(([k, v]) => localStorage.setItem(k, v));
    document.getElementById('summary').textContent = `${pass} geçti, ${fail} başarısız. Verilerin geri yüklendi.`;
    document.title = fail ? 'BAŞARISIZ' : 'GEÇTİ';
    window.testResult = {pass, fail};
  }
})();
